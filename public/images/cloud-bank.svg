<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800">
  <!-- Original cloud silhouette. Alpha is feathered, then broken up with seeded noise. -->
  <defs>
    <filter id="edge" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .017" numOctaves="3" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="100" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <g fill="white" filter="url(#edge)">
    <path d="M-160 410C-20 180 80 430 225 245S440 310 565 205 740 370 880 240 1080 200 1200 325 1430 175 1760 370V1390C1550 1610 1440 1370 1250 1550S1040 1420 880 1580 650 1390 510 1530 250 1380 120 1500-70 1410-160 1440Z"/>
    <ellipse cx="100" cy="430" rx="240" ry="175"/>
    <ellipse cx="530" cy="350" rx="240" ry="145"/>
    <ellipse cx="1040" cy="360" rx="280" ry="175"/>
    <ellipse cx="1510" cy="430" rx="250" ry="180"/>
  </g>
</svg>
